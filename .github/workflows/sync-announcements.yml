# Pulls the announcements folder from Google Drive every 30 minutes and commits
# the result. Deleting a file in Drive removes it from the site on the next run.
#
# Before this can work, add two repository secrets:
#   DRIVE_FOLDER_ID   the folder id from its share link
#   GOOGLE_API_KEY    a Google Cloud API key with the Drive API enabled
#
# A sync only commits to git. The server-side sac-poll-deploy.timer picks up
# new commits on main within 10 minutes and ships them to the live site.
name: Sync announcements from Drive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-announcements
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keeps scheduled runs green until the Drive integration is switched on.
      # (Plain bash check — `secrets` is rejected in `if:` expressions.)
      - name: Read the Drive folder
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$DRIVE_FOLDER_ID" ] || [ -z "$GOOGLE_API_KEY" ]; then
            echo "DRIVE_FOLDER_ID / GOOGLE_API_KEY not set — sync is dormant."
            echo "Add the two repository secrets to enable it."
            exit 0
          fi
          node scripts/sync-announcements.mjs

      - name: Commit any change
        run: |
          if [ -n "$(git status --porcelain src/data/announcements.json)" ]; then
            git config user.name  "sac-web-team-bot"
            git config user.email "noreply@users.noreply.github.com"
            git add src/data/announcements.json
            git commit -m "Sync announcements from Drive"
            git push
          else
            echo "Nothing changed."
          fi
